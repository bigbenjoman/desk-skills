name: tests

# The one check the merge gate requires, `tests`, comes from this workflow and nothing else. It has no
# workflow_dispatch: a dispatched run would write a passing `tests` onto whatever commit it ran on.
# The full suite on macOS (the stock bash 3.2) runs on each push to main from nightly-macos.yml under
# another name, and ci-main-red.yml opens an issue while main or the macOS lane is red or stale.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR makes the run still going on the old head worthless, so cancel it.
# Pushes to main each get their own group and always finish.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request runs the suites its change reaches (tests/scope_sections.mjs, which runs every suite
  # when it cannot place a changed file); a push to main runs every suite. tests/plan_shards.mjs splits
  # them into parallel shards by the durations main's latest push run recorded, else the committed
  # tests/suite_durations.json.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      shells: ${{ steps.scope.outputs.shells }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, whose first parent is the base it merges into.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The prose baseline only shrinks. On every pull request, whatever suites its change reaches.
      - name: The prose baseline does not grow
        if: github.event_name == 'pull_request'
        run: node tests/prose_baseline_guard.mjs --base HEAD^1
      - name: Choose the suites
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-status -M HEAD^1...HEAD
            node tests/scope_sections.mjs --base HEAD^1 --head HEAD --github-output
          else
            node tests/scope_sections.mjs --full --github-output
          fi
      - name: Fetch main's durations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tests/plan_shards.mjs --fetch "$RUNNER_TEMP/durations"
      # Each shard runs 3 suites at once (the shard job's Run tests step), so it plans 3 lanes a shard.
      - name: Plan the shards
        id: shards
        env:
          SUITES: ${{ steps.scope.outputs.suites }}
        run: node tests/plan_shards.mjs --suites "$SUITES" --jobs 3 --durations "$RUNNER_TEMP/durations/suite_durations.json" --github-output

  # The stock macOS bash (3.2.57) in Docker: `bash -n`, and a scan for bash 4+ features that parse
  # in 3.2 but fail when run, over the changed shell scripts and those the chosen suites run.
  bash32:
    name: bash 3.2
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shell scripts under bash 3.2
        env:
          SHELLS: ${{ needs.plan.outputs.shells }}
        run: |
          # shellcheck disable=SC2086  # repo paths, one per word
          bash tests/bash32_check.sh $SHELLS

  # The JSDoc types desk-ui reads desk's data through: tsc checks the files desk/tsconfig.json names
  # (the read model and desk-env), then writes them out as .d.ts files. TypeScript is pinned here and
  # installed outside the checkout, so desk itself still has no package.json and no node_modules.
  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TS: typescript@5.9.3
      NODE_TYPES: '@types/node@24.10.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install TypeScript
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund "$TS" "$NODE_TYPES"
      - name: Type check
        run: '"$RUNNER_TEMP/ts/node_modules/.bin/tsc" -p desk/tsconfig.json --typeRoots "$RUNNER_TEMP/ts/node_modules/@types" --pretty false'
      - name: Emit the declarations
        run: |
          "$RUNNER_TEMP/ts/node_modules/.bin/tsc" -p desk/tsconfig.decl.json --typeRoots "$RUNNER_TEMP/ts/node_modules/@types" --pretty false
          ls -R desk/types
          bad=0
          for t in HomeView RepoView TicketView UsageView CostsView; do
            grep -q "type $t = " desk/types/desk-q-model.d.ts || { echo "desk-q-model.d.ts does not declare $t"; bad=1; }
          done
          grep -q "type GetJson = " desk/types/desk-env.d.ts || { echo "desk-env.d.ts does not declare GetJson"; bad=1; }
          exit "$bad"
      - name: Save the declarations
        uses: actions/upload-artifact@v4
        with:
          name: desk-types
          path: desk/types/
          retention-days: 7

  shard:
    name: shard ${{ matrix.shard }}/${{ matrix.of }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # shellcheck's findings do not depend on the OS, so Linux (where it is preinstalled) requires it;
    # test_lint.sh, in whichever shard runs it, reads this. Likewise test_stitch.mjs and test_design.mjs
    # fail rather than skip their browser checks without desk's Playwright, which the shard installs.
    env:
      DESK_REQUIRE_SHELLCHECK: '1'
      DESK_REQUIRE_PLAYWRIGHT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Ensure jq
        run: |
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          jq --version
          shellcheck --version | head -2
      # Desk's pinned Playwright (install.sh's PLAYWRIGHT_VERSION) and its Chromium, where and as
      # install.sh puts them, for the suites that render in a browser.
      - name: Install desk's Playwright
        if: contains(matrix.suites, 'test_stitch.mjs') || contains(matrix.suites, 'test_design.mjs')
        run: |
          v=$(sed -n 's/^PLAYWRIGHT_VERSION="\(.*\)"$/\1/p' install.sh)
          [ -n "$v" ] || { echo "no PLAYWRIGHT_VERSION in install.sh"; exit 1; }
          bash desk/bin/install-playwright.sh --with-deps "$HOME/.claude/desk/playwright" "$v"
      # The result file is the shard's report to the tests job: written only once run.sh has finished,
      # so a shard cancelled or timed out leaves none. run.sh writes the suites' durations beside it.
      # A suite over its CPU budget fails a pull request from the date in run.sh, and only warns on
      # main, where the record job opens a ci-slow issue for it instead.
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          SUITES: ${{ matrix.suites }}
          HOOK: ${{ matrix.hook }}
          DESK_SUITE_BUDGETS: ${{ github.event_name == 'pull_request' && 'enforce' || 'warn' }}
        run: |
          bash --version | head -1
          set +e
          mkdir -p "$RUNNER_TEMP/result"
          # 3 suites at once on the 4 vCPU runner
          DESK_SUITE_DURATIONS="$RUNNER_TEMP/result/durations-$SHARD.json" bash tests/ci_shard.sh 3 2>&1 | tee "$RUNNER_TEMP/run.log"
          rc=${PIPESTATUS[0]}
          failed=$(grep -m 1 '^failed suites:' "$RUNNER_TEMP/run.log" | cut -d: -f2-)
          flaked=$(grep -m 1 '^flaked:' "$RUNNER_TEMP/run.log" | cut -d: -f2-)
          slow=$(grep -m 1 '^over budget:' "$RUNNER_TEMP/run.log" | cut -d: -f2-)
          printf 'rc=%s\nfailed=%s\nflaked=%s\nslow=%s\n' "$rc" "${failed# }" "${flaked# }" "${slow# }" > "$RUNNER_TEMP/result/shard-$SHARD.txt"
          exit "$rc"
      - name: Save the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

  # The check branch protection and auto-release read. It runs whatever happened above, so a failed,
  # cancelled or skipped shard turns it red rather than leaving it skipped.
  tests:
    name: tests
    needs: [plan, bash32, types, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-*
          path: results
          merge-multiple: true
      - name: Every shard passed
        env:
          PLAN: ${{ needs.plan.result }}
          BASH32: ${{ needs.bash32.result }}
          TYPES: ${{ needs.types.result }}
          SHARDS: ${{ needs.shard.result }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          bad=0
          [ "$PLAN" = success ] || { echo "plan: $PLAN"; bad=1; }
          [ "$BASH32" = success ] || { echo "bash 3.2 check: $BASH32"; bad=1; }
          [ "$TYPES" = success ] || { echo "type check: $TYPES"; bad=1; }
          of=$(printf '%s' "$MATRIX" | jq -r '.include | length' 2>/dev/null)
          for n in $(printf '%s' "$MATRIX" | jq -r '.include[].shard' 2>/dev/null); do
            f="results/shard-$n.txt"
            if [ ! -f "$f" ]; then echo "shard $n/$of did not finish: cancelled, timed out or stopped before its suites ran"; bad=1; continue; fi
            rc=$(sed -n 's/^rc=//p' "$f"); failed=$(sed -n 's/^failed=//p' "$f"); flaked=$(sed -n 's/^flaked=//p' "$f")
            if [ "$rc" = 0 ]; then echo "shard $n/$of passed"; else echo "shard $n/$of failed: ${failed:-exit $rc}"; bad=1; fi
            [ -z "$flaked" ] || echo "shard $n/$of flaked (failed, then passed its retry): $flaked"
            slow=$(sed -n 's/^slow=//p' "$f")
            [ -z "$slow" ] || echo "shard $n/$of over CPU budget (<suite>=<CPU seconds>/<budget>): $slow"
          done
          [ "$SHARDS" = success ] || { echo "shards: $SHARDS"; bad=1; }
          exit "$bad"

  # A push to main records its suites' durations, which later runs plan from, and opens or comments the
  # ci-slow and ci-flaky issues (tests/ci_main_red.mjs suites). A suite over budget or flaked fails
  # nothing; a step here that cannot record fails the run, so the red-main alarm shows it.
  record:
    name: record main
    needs: [plan, shard, tests]
    if: always() && github.event_name == 'push' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the shard results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: results
          merge-multiple: true
      - name: Merge the durations
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: node tests/plan_shards.mjs --merge results --of "$(printf '%s' "$MATRIX" | jq -r '.include | length')" --out durations/suite_durations.json
      - name: Save the durations
        uses: actions/upload-artifact@v4
        with:
          name: suite-durations
          path: durations/
          if-no-files-found: ignore
          retention-days: 30
      - name: Open or update the ci-slow and ci-flaky issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: node tests/ci_main_red.mjs suites results
