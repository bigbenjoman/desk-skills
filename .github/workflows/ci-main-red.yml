name: ci main red

# Red main is visible: one open issue labelled ci-main-red while the latest `tests` push run on main or
# the latest nightly macOS run is red, updated with each red run, commented and closed once both are
# green again. It runs on the default branch's copy of this file with an issues-write token, reads
# only run metadata through gh, and checks out no code.
on:
  workflow_run:
    workflows: [tests, nightly macOS]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-main-red
  cancel-in-progress: false

jobs:
  track:
    name: track red main
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_CREATED: ${{ github.event.workflow_run.created_at }}
    steps:
      - name: Open, update or close the issue
        run: |
          set -u
          # The latest finished run of each watched workflow on main: tests from pushes, macOS from
          # any trigger. Red is failure, timed_out or startup_failure; a cancelled run says nothing.
          latest() {
            local q='[.[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0] // empty | "\(.conclusion) \(.url) \(.headSha[0:7]) \(.createdAt)"'
            if [ -n "${2:-}" ]; then gh run list --workflow "$1" --branch main --event "$2" --status completed --limit 10 --json conclusion,url,headSha,createdAt --jq "$q"
            else gh run list --workflow "$1" --branch main --status completed --limit 10 --json conclusion,url,headSha,createdAt --jq "$q"; fi
          }
          red=""
          check() {  # <label> <workflow file> [event]
            local l
            l=$(latest "$2" "${3:-}") || { echo "cannot read the runs of $2"; exit 1; }
            # The run that triggered this is the newest of its workflow unless the listing shows a later
            # one; prefer its own conclusion, which the listing may not show yet.
            if [ "$1" = "$RUN_NAME" ] && [ "$RUN_CONCLUSION" != cancelled ] && [ "$RUN_CONCLUSION" != skipped ] &&
               { [ -z "$l" ] || [[ ! "${l##* }" > "$RUN_CREATED" ]]; }; then
              l="$RUN_CONCLUSION $RUN_URL ${RUN_SHA:0:7} $RUN_CREATED"
            fi
            l=${l% *}
            echo "$1: ${l:-no finished run}"
            case "${l%% *}" in failure|timed_out|startup_failure) red="$red- $1: ${l#* }"$'\n' ;; esac
          }
          check tests tests.yml push
          check "nightly macOS" nightly-macos.yml
          gh label create ci-main-red --color B60205 --description "tests are failing on main or nightly" 2>/dev/null || true
          issue=$(gh issue list --label ci-main-red --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$red" ]; then
            body="**${RUN_NAME}** finished **${RUN_CONCLUSION}** on main at ${RUN_SHA:0:7}: ${RUN_URL}"$'\n\n'"Red now:"$'\n'"$red"
            if [ -n "$issue" ]; then
              case "$RUN_CONCLUSION" in success) ;; *) gh issue comment "$issue" --body "$body" ;; esac
            else
              gh issue create --label ci-main-red --title "main is red: tests failing on main or nightly macOS" \
                --body "$body"$'\n'"This issue closes itself when the latest run of each is green again (.github/workflows/ci-main-red.yml)."
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Green again: **${RUN_NAME}** passed at ${RUN_SHA:0:7} (${RUN_URL}), and the latest tests and nightly macOS runs on main are both green."
            gh issue close "$issue"
          else
            echo "main is green and no issue is open"
          fi
