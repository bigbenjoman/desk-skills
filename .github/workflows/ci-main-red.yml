name: ci main red

# Red main is visible: one open issue labelled ci-main-red, assigned to the repo's owner, while the
# latest `tests` push run on main is red, or the macOS lane's latest run is red, cancelled or more than
# 36 h old with none queued or running. It is commented with each red run, and commented and closed once every lane is green and
# fresh (tests/ci_main_red.mjs). It runs after each run of either workflow, and daily, so a lane that
# stopped running still goes stale. It runs on the default branch's copy of this file and of the
# script, with an issues-write token, and reads only run metadata through gh: it never checks out the
# code of the run that triggered it.
on:
  workflow_run:
    workflows: [tests, macOS]
    types: [completed]
  schedule:
    - cron: '47 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-main-red
  cancel-in-progress: false

jobs:
  track:
    name: track red main
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_CREATED: ${{ github.event.workflow_run.created_at }}
        run: node tests/ci_main_red.mjs alarm
