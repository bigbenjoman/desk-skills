name: aws fallback watch

# The AWS runner watchdog: every 10 minutes, each repo in the DESK_AWS_WATCHED_REPOS variable
# (comma-separated owner/name) with a job queued on one of its declared AWS runner labels for over
# 15 minutes gets its DESK_AWS_FALLBACK variable turned on, so its CI runs on GitHub-hosted runners,
# an issue here naming it, and its queued runs cancelled and re-run (desk/bin/aws-fallback.mjs). It
# never turns a fallback off: `desk-ci.mjs aws-fallback off` does. The DESK_AWS_FALLBACK_TOKEN secret
# is a fine-grained token with Variables and Actions write and Contents read on the watched repos.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-fallback-watch
  cancel-in-progress: false

jobs:
  watch:
    name: watch AWS runners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Turn on the fallback of each repo whose AWS runners stopped taking jobs
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_TOKEN: ${{ secrets.DESK_AWS_FALLBACK_TOKEN }}
          DESK_AWS_WATCHED_REPOS: ${{ vars.DESK_AWS_WATCHED_REPOS }}
        run: node desk/bin/aws-fallback.mjs watch
